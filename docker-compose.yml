services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sqlapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqlapp}
      POSTGRES_DB: ${POSTGRES_DB:-sql_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - queryai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    networks:
      - queryai

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./client/.env
    environment:
      # Overrides localhost URLs from client/.env for the Docker network.
      DATABASE_URL: postgres://${POSTGRES_USER:-sqlapp}:${POSTGRES_PASSWORD:-sqlapp}@postgres:5432/${POSTGRES_DB:-sql_app}
      FLASK_URL: http://server:8000
    ports:
      - "3000:3000"
    networks:
      - queryai
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started

networks:
  queryai:
    driver: bridge

volumes:
  postgres_data:
